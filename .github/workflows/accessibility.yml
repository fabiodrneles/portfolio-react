name: Acessibilidade

# WCAG 2.2 nível AA (base da Lei Brasileira de Inclusão, art. 63, e do eMAG).
# Dois motores independentes: axe-core (via Cypress) e HTML_CodeSniffer (via Pa11y).
on:
  push:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  axe:
    name: axe-core (Cypress)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes de acessibilidade
        uses: cypress-io/github-action@v6
        env:
          CYPRESS_BASE_URL: http://localhost:3000
        with:
          build: npm run build
          start: npm run start
          wait-on: http://localhost:3000
          wait-on-timeout: 180
          spec: cypress/e2e/a11y.cy.js
      - name: Guarda as capturas de tela da falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  pa11y:
    name: Pa11y (HTML_CodeSniffer, WCAG2AA)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instala as dependências (sem baixar navegador; usa o Chrome do runner)
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - run: npm run build
      - name: Sobe o site
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 180000
      - name: Pa11y nas páginas principais, nos três idiomas
        run: npx --yes pa11y-ci@3 --config .pa11yci.json
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
