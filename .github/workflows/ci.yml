name: End-to-end tests

on:
  push:

jobs:
  cypress-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      # Testa o build de produção do próprio commit (não o site já publicado)
      - name: Cypress run
        uses: cypress-io/github-action@v6
        env:
          CYPRESS_BASE_URL: http://localhost:3000
        with:
          build: npm run build
          start: npm run start
          wait-on: http://localhost:3000
          wait-on-timeout: 180
